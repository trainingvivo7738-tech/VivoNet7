<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#008F8B" name="theme-color"/>
<title>Hola, soy Vigo</title>
<style>
:root{--turq:#008F8B;--turq-dark:#006E6B;--turq-deep:#005B59;--turq-soft:#DFF5F3;--turq-wash:#F0FBFA;--ink:#24343A;--muted:#617278;--line:#D5E7E6;--bg:#F3F9F9;--white:#FFFFFF;--radius:17px;--shadow:0 4px 14px rgba(0,85,82,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh}button,select{font:inherit}.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:22px}.header{background:var(--turq);color:var(--white);padding:calc(17px + env(safe-area-inset-top)) 17px 24px;border-radius:0 0 25px 25px;box-shadow:0 7px 20px rgba(0,100,97,.13)}.topline{display:flex;align-items:center;gap:10px;margin-bottom:19px}.brand-mark{width:39px;height:39px;display:grid;place-items:center;border:1px solid #ffffff70;background:#ffffff18;border-radius:12px}.brand-mark img{width:35px;height:35px;object-fit:contain;border-radius:9px;background:#fff;display:block}.brand-mark{overflow:hidden;background:#fff;border-color:#fff}.brand{font-size:17px;font-weight:800;letter-spacing:.1px}.brand span{font-weight:450;opacity:.83}.pill{margin-left:auto;border:1px solid #ffffff75;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:750;letter-spacing:.45px;white-space:nowrap}.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#D1F7F4;font-weight:800;margin:0 0 7px}h1{font-size:28px;line-height:1.1;margin:0 0 8px;font-weight:820;letter-spacing:-.65px}.subtitle{font-size:13px;line-height:1.5;margin:0;color:#E7FAF9;max-width:390px}main{padding:15px 13px 0}.tools{display:flex;flex-direction:column;gap:10px}.tool-block{width:100%}.tool{width:100%;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 12px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);text-align:left;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:border-color .16s,background .16s,transform .16s}.tool:active{transform:scale(.99)}.tool[aria-expanded="true"]{border-color:var(--turq);border-radius:15px;background:var(--turq-wash);box-shadow:0 2px 8px rgba(0,85,82,.05)}.tool .icon{flex:0 0 43px;width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:var(--turq-soft);color:var(--turq-dark);border:1px solid #C8EAE8}.tool.primary .icon{background:var(--turq-soft);color:var(--turq-dark)}.tool .icon svg,.content-head .badge svg,.brand-mark svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.tool-copy{flex:0 1 auto;min-width:0;text-align:center;width:100%}.tool strong{display:block;text-align:center;font-size:13px;line-height:1.3;margin:0 0 4px}.tool small{display:block;text-align:center;font-size:11px;line-height:1.4;color:var(--muted)}.panel{margin:8px 0 2px;padding:15px 14px 14px;border:1px solid var(--line);border-left:3px solid var(--turq);border-radius:14px;background:#fff;box-shadow:0 5px 16px rgba(0,85,82,.06);animation:panelIn .18s ease-out;transform-origin:top}@keyframes panelIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}.panel[hidden]{display:none}.content-head{display:flex;align-items:center;gap:10px;margin:0 0 10px}.content-head .badge{width:37px;height:37px;flex:0 0 37px;display:grid;place-items:center;background:var(--turq-soft);color:var(--turq-dark);border-radius:12px}.content-head h2{font-size:16px;line-height:1.25;margin:0}.content-head p{font-size:11px;color:var(--muted);margin:3px 0 0;line-height:1.4}.intro{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 11px}label{font-size:12px;font-weight:800;display:block;margin:14px 0 7px}select{width:100%;border:1px solid #BDD9D8;border-radius:11px;background:#fff;padding:12px;color:var(--ink);outline:none}select:focus{border-color:var(--turq);box-shadow:0 0 0 3px #008F8B20}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;color:#3B555A;cursor:pointer;line-height:1.2}.chip.active{background:var(--turq-soft);border-color:var(--turq);color:var(--turq-deep);font-weight:800}.result{margin-top:13px;padding:13px;border-radius:13px;background:var(--turq-wash);border:1px solid #BFE5E2;font-size:12px;line-height:1.55}.result h3{margin:0 0 7px;font-size:14px;line-height:1.35;color:var(--turq-dark)}.result p{margin:7px 0}.result ol,.result ul{padding-left:19px;margin:7px 0}.result li{margin:5px 0}.result .talk{padding:10px 11px;margin-top:9px;border-left:3px solid var(--turq);background:#fff;border-radius:6px}.result .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--turq-dark);background:var(--turq-soft);padding:4px 7px;border-radius:6px;margin-bottom:6px}.result a,.source-link{color:var(--turq-dark);font-weight:750;text-decoration:underline;text-underline-offset:2px}.source-note{font-size:10px;color:var(--muted);line-height:1.45;margin:9px 0 0}.secondary-btn{width:100%;border:1px solid #A6D8D5;background:#F4FCFB;color:var(--turq-dark);border-radius:11px;padding:11px 12px;font-weight:750;font-size:12px;margin-top:12px;cursor:pointer}.notice{font-size:10px;color:var(--muted);line-height:1.45;margin:15px 3px 0}.footer{text-align:center;color:#6E9291;font-size:10px;padding:16px 10px}.section-rule{height:1px;background:var(--line);margin:12px 0}.micro{font-size:10px;color:var(--muted);line-height:1.45}@media(max-width:360px){main{padding-left:10px;padding-right:10px}.tool{padding:11px;gap:10px;min-height:84px}.tool .icon{flex-basis:40px;width:40px;height:40px}.tool strong{font-size:12px}.tool small{font-size:10px}.header{padding-left:15px;padding-right:15px}.panel{padding:13px 11px}}

.mascot-top{display:flex;justify-content:center;align-items:center;margin:0 auto 11px;width:68px;height:68px;border-radius:20px;background:#fff;box-shadow:0 4px 12px rgba(0,60,58,.12);overflow:hidden}.mascot-top img{width:100%;height:100%;object-fit:contain;display:block}header.header h1{text-align:center;margin-bottom:5px}header.header .eyebrow{text-align:center;display:block;margin:5px 0 9px;font-size:11px;letter-spacing:.5px;text-transform:none;color:#E7FAF9}header.header .subtitle{text-align:center;margin-left:auto;margin-right:auto}

/* VivoNet integration: full-screen navigation, welcome per local day */
.header{position:relative;padding-top:calc(62px + env(safe-area-inset-top))}
.vivonet-home{position:absolute;z-index:5;top:calc(12px + env(safe-area-inset-top));left:14px;width:42px;height:42px;display:grid;place-items:center;border:1px solid #CFE4FF;border-radius:13px;background:#EAF3FF;color:#1769D2;box-shadow:0 2px 7px rgba(23,105,210,.09);cursor:pointer;transition:transform .16s,background .16s}
.vivonet-home:active{transform:scale(.96);background:#DCEBFF}
.vivonet-home svg{width:25px;height:25px;display:block}
.vivonet-home:focus-visible{outline:3px solid #1769D2;outline-offset:2px}
.welcome-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#E8F8F7 0%,#FFFFFF 100%);opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease}
.welcome-screen[hidden]{display:none!important}
.welcome-screen.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
.welcome-card{width:min(100%,390px);text-align:center;padding:28px 22px 24px;border:1px solid #CDEBE8;border-radius:26px;background:#fff;box-shadow:0 12px 40px rgba(0,100,97,.10);animation:welcomePop .45s cubic-bezier(.2,.75,.25,1) both}
.welcome-mascot{width:96px;height:96px;margin:0 auto 18px;border-radius:26px;background:#EAF3FF;display:grid;place-items:center;overflow:hidden;box-shadow:0 5px 15px rgba(23,105,210,.10)}
.welcome-mascot img{width:100%;height:100%;object-fit:contain}
.welcome-card h2{font-size:25px;line-height:1.15;letter-spacing:-.5px;color:#1769D2;margin:0 0 9px}
.welcome-card p{font-size:14px;line-height:1.55;color:#617278;margin:0 auto 19px;max-width:290px}
.welcome-continue{border:0;border-radius:13px;background:#1769D2;color:white;padding:12px 20px;font-size:13px;font-weight:800;cursor:pointer;min-height:44px}
.welcome-continue:focus-visible{outline:3px solid #8BBEFF;outline-offset:3px}
@keyframes welcomePop{from{opacity:0;transform:translateY(9px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.welcome-screen,.welcome-card,}
@media(max-width:360px){.header{padding-top:calc(58px + env(safe-area-inset-top))}.welcome-card{padding:24px 18px}}

.return-vivonet{display:block;width:auto;min-width:0;max-width:190px;margin:48px auto 18px;padding:7px 11px;border:1px solid #B7D6FF;border-radius:11px;background:#EAF3FF;color:#1769D2;font-size:12px;font-weight:800;text-align:center;cursor:pointer;box-shadow:none}.return-vivonet:active{background:#DCEBFF;transform:scale(.99)}.return-vivonet:focus-visible{outline:3px solid #1769D2;outline-offset:2px}

/* Revision 6: compactar pantalla principal para que todo quepa mejor */
.header{padding:calc(12px + env(safe-area-inset-top)) 14px 15px!important;border-radius:0 0 19px 19px!important;box-shadow:0 4px 12px rgba(0,100,97,.10)!important}
.header .vivonet-home{top:calc(8px + env(safe-area-inset-top))!important;left:12px!important;width:36px!important;height:36px!important}
.mascot-top{width:48px!important;height:48px!important;margin:0 auto 6px!important;border-radius:14px!important}
header.header h1{font-size:22px!important;line-height:1.08!important;margin:0 0 3px!important}
header.header .eyebrow{font-size:10px!important;margin:2px 0 5px!important}
header.header .subtitle{font-size:11px!important;line-height:1.35!important;max-width:320px!important}
main{padding:10px 12px 0!important}
.tools{gap:7px!important}
.tool{min-height:0!important;padding:9px 10px!important;gap:5px!important;border-radius:14px!important}
.tool .icon{flex-basis:34px!important;width:34px!important;height:34px!important;border-radius:10px!important}
.tool .icon svg{width:19px!important;height:19px!important}
.tool strong{font-size:12px!important;line-height:1.2!important;margin:0 0 2px!important}
.tool small{font-size:10px!important;line-height:1.28!important}
.return-vivonet{margin:20px auto 12px!important;padding:6px 10px!important;font-size:11px!important}
.footer{padding:10px 8px!important}
@media(max-height:760px){.header{padding-top:calc(8px + env(safe-area-inset-top))!important;padding-bottom:11px!important}.mascot-top{width:42px!important;height:42px!important;margin-bottom:4px!important}header.header h1{font-size:20px!important}.tool{padding:7px 9px!important}.tools{gap:6px!important}.return-vivonet{margin-top:14px!important}}

</style>
</head>

function toggleTool(key){const isOpen=!panels[key].hidden;Object.keys(panels).forEach(k=>{panels[k].hidden=true;document.getElementById('btn-'+k).setAttribute('aria-expanded','false')});if(isOpen)return;const p=panels[key];p.innerHTML=bodyFor(key)+`<button class="secondary-btn" type="button" onclick="closeTool('${key}')">Cerrar sección</button>`;p.hidden=false;document.getElementById('btn-'+key).setAttribute('aria-expanded','true');wirePanel(key);refresh(key)}
function closeTool(key){panels[key].hidden=true;document.getElementById('btn-'+key).setAttribute('aria-expanded','false')}

if(key==='products')return `<p class="intro">Elige un concepto y Vigo te lo explica sin tecnicismos innecesarios.</p><label>Concepto</label><div class="chips" id="concepts"><button class="chip active" data-v="AMOLED">AMOLED</button><button class="chip" data-v="Hz">Hz</button><button class="chip" data-v="RAM">RAM</button><button class="chip" data-v="Almacenamiento">Almacenamiento</button><button class="chip" data-v="Carga rápida">Carga rápida</button><button class="chip" data-v="5G">5G</button><button class="chip" data-v="IP65 e IP68/IP69">IP65 e IP68/IP69</button><button class="chip" data-v="OIS">OIS</button><button class="chip" data-v="MP">Megapíxeles (MP)</button><button class="chip" data-v="USB-C">USB-C</button></div><div class="result" id="result-products" aria-live="polite"></div>`;
if(key==='objections')return `<p class="intro">Escoge la objeción real y adapta la respuesta al tono de la conversación.</p><label>¿Qué dijo el cliente?</label><div class="chips" id="objection-chips"><button class="chip active" data-v="caro">«Está muy caro»</button><button class="chip" data-v="otra marca">«Prefiero otra marca»</button><button class="chip" data-v="ya funciona">«Mi celular todavía funciona»</button><button class="chip" data-v="no conozco">«No conozco vivo»</button><button class="chip" data-v="lo voy a pensar">«Lo voy a pensar»</button><button class="chip" data-v="mi celular tiene espacio">«El mío todavía tiene espacio»</button><button class="chip" data-v="me preocupa la batería">«Me preocupa la batería»</button><button class="chip" data-v="la cámara no me convence">«Quiero probar la cámara»</button><button class="chip" data-v="quiero más memoria">«Quiero más memoria»</button><button class="chip" data-v="no quiero cambiar ahora">«No quiero cambiar ahora»</button><button class="chip" data-v="no sé cuál elegir">«No sé cuál elegir»</button></div><div class="result" id="result-objections" aria-live="polite"></div>`;
return `<p class="intro">Selecciona el modelo y después el aspecto que quieres enseñar. Vigo ajustará tanto el dato técnico como la prueba práctica.</p><label for="demoModel">Modelo vivo</label><select id="demoModel"><option value="v80">vivo V80 Lite 5G</option><option value="v70">vivo V70 FE</option><option value="y31">vivo Y31d</option><option value="y11">vivo Y11d</option><option value="y05">vivo Y05</option></select><label>Característica que quieres demostrar</label><div class="chips" id="demo-chips"><button class="chip active" data-v="cam">Cámara</button><button class="chip" data-v="screen">Pantalla</button><button class="chip" data-v="battery">Batería y carga</button><button class="chip" data-v="storage">RAM y almacenamiento</button><button class="chip" data-v="network">Conectividad</button><button class="chip" data-v="durability">Protección</button></div><div class="result" id="result-demo" aria-live="polite"></div>`}
function wirePanel(key){const p=panels[key];p.querySelectorAll('.chips').forEach(group=>group.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{group.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');refresh(key)})));p.querySelectorAll('select').forEach(s=>s.addEventListener('change',()=>refresh(key)))}
function chosen(id, fallback=''){return document.querySelector(`#${id} .chip.active`)?.dataset.v||fallback}
function renderResult(id,title,body){const el=document.getElementById(id);if(el)el.innerHTML=`<h3>${title}</h3>${body}`}

// Bienvenida de Vigo una vez por fecha local del dispositivo.
(function initVigoWelcome(){
  const overlay = document.getElementById('vigoWelcome');
  if (!overlay) return;
  const today = new Date();
  const dayKey = 'vigo-welcome-date-' + today.getFullYear() + '-' +
    String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  try {
    if (localStorage.getItem('vigo-welcome-last-date') !== dayKey) {
      localStorage.setItem('vigo-welcome-last-date', dayKey);
      overlay.hidden = false;
      document.body.style.overflow = 'hidden';
      const mascot = document.querySelector('.mascot-top img');
      const welcomeMascot = document.getElementById('welcomeMascotImage');
      if (mascot && welcomeMascot) welcomeMascot.src = mascot.src;
      window.setTimeout(() => {
        if (!overlay.hidden) dismissVigoWelcome();
      }, 2600);
    } else {
      overlay.hidden = true;
    }
  } catch (e) {
    // Si el almacenamiento está bloqueado, la bienvenida se muestra en esta visita.
    overlay.hidden = false;
    const mascot = document.querySelector('.mascot-top img');
    const welcomeMascot = document.getElementById('welcomeMascotImage');
    if (mascot && welcomeMascot) welcomeMascot.src = mascot.src;
  }
})();
function dismissVigoWelcome(){
  const overlay = document.getElementById('vigoWelcome');
  if (!overlay || overlay.hidden) return;
  overlay.classList.add('is-leaving');
  document.body.style.overflow = '';
  window.setTimeout(() => { overlay.hidden = true; overlay.classList.remove('is-leaving'); }, 360);
}
function returnToVivoNet(){
  // Si Vigo está integrado dentro de VivoNet, volver al inicio sin depender de rutas externas.
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({type:'VIVONET_RETURN_HOME'}, '*');
      return;
    }
    if (window.history.length > 1) {
      window.history.back();
      return;
    }
  } catch(e) {}
  // En modo archivo independiente no hay página VivoNet a la que volver.
  const btn = document.querySelector('.vivonet-home');
  if (btn) {
    btn.setAttribute('aria-label','Para volver, usa el botón Atrás de tu navegador');
    btn.title = 'Abre Vigo desde VivoNet para regresar con este botón';
  }
}
